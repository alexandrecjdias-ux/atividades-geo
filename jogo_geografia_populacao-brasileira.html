<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geografia 7º · População Brasileira</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Nunito',sans-serif;background:#0f172a;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 1rem 3rem}
  .container{max-width:560px;width:100%}
  #tela-inicio{text-align:center;animation:fadeIn 0.5s ease}
  .logo{font-size:72px;margin-bottom:12px;display:block}
  .game-title{font-size:26px;font-weight:900;color:white;margin-bottom:4px}
  .game-disc{font-size:13px;font-weight:700;color:#6366f1;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px}
  .game-sub{font-size:14px;color:#94a3b8;margin-bottom:1.5rem}
  .info-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:1.25rem}
  .info-box{background:#1e293b;border-radius:14px;padding:14px 10px;text-align:center}
  .info-icon{font-size:22px;display:block;margin-bottom:4px}
  .info-label{font-size:11px;color:#64748b;display:block}
  .info-val{font-size:14px;font-weight:800;color:white;display:block;margin-top:2px}
  .form-wrap{background:#1e293b;border-radius:16px;padding:1.25rem;margin-bottom:1rem;text-align:left}
  .form-lbl{font-size:12px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;display:block}
  .form-inp{width:100%;padding:12px 14px;background:#0f172a;border:2px solid #334155;border-radius:12px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;color:white;outline:none;transition:border 0.2s;margin-bottom:12px}
  .form-inp::placeholder{color:#475569}
  .form-inp:focus{border-color:#6366f1}
  .form-select{width:100%;padding:12px 14px;background:#0f172a;border:2px solid #334155;border-radius:12px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;color:white;outline:none;transition:border 0.2s;appearance:none;cursor:pointer}
  .form-select:focus{border-color:#6366f1}
  .btn-start{width:100%;padding:16px;font-family:'Nunito',sans-serif;font-size:18px;font-weight:900;color:white;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:16px;cursor:pointer;transition:all 0.2s;box-shadow:0 6px 24px rgba(99,102,241,0.5)}
  .btn-start:hover{transform:translateY(-2px)}
  #hud{display:none;background:#1e293b;border-radius:16px;padding:12px 16px;margin-bottom:1rem}
  .hud-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .hud-fase{font-size:13px;font-weight:800;color:#94a3b8}
  .hud-fase span{color:white}
  .hud-pontos{font-size:13px;font-weight:800;color:#fbbf24}
  .vidas{display:flex;gap:5px}
  .vida{font-size:20px;transition:all 0.3s}
  .vida.perdida{filter:grayscale(1);opacity:0.25;transform:scale(0.8)}
  .progress-wrap{background:#0f172a;border-radius:20px;height:6px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);border-radius:20px;transition:width 0.5s ease}
  #tela-fase{display:none}
  .fase-badge{display:inline-flex;align-items:center;gap:6px;background:#1e293b;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:800;color:#a78bfa;margin-bottom:14px}
  .fase-num-badge{background:#6366f1;color:white;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
  .tag-mec{margin-left:6px;background:#7c3aed;color:white;border-radius:8px;padding:2px 8px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
  .pergunta-card{background:#1e293b;border-radius:20px;padding:1.5rem;margin-bottom:1rem;border-top:4px solid var(--cor)}
  .pergunta-emoji{font-size:34px;display:block;margin-bottom:10px}
  .pergunta-texto{font-size:16px;font-weight:800;color:white;line-height:1.5}
  .opcoes{display:flex;flex-direction:column;gap:10px}
  .opcao{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;background:#1e293b;border:2px solid #334155;border-radius:14px;cursor:pointer;transition:all 0.2s}
  .opcao:hover{border-color:#6366f1;transform:translateX(4px)}
  .opcao-letra{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;background:#0f172a;color:#64748b;flex-shrink:0;transition:all 0.2s;margin-top:1px}
  .opcao-texto{font-size:14px;font-weight:700;color:#cbd5e1;line-height:1.4}
  .opcao.correta{border-color:#4ade80!important;background:#052e16!important;pointer-events:none}
  .opcao.correta .opcao-letra{background:#4ade80;color:#052e16}
  .opcao.correta .opcao-texto{color:#4ade80}
  .opcao.errada{border-color:#f87171!important;background:#2d0a0a!important;pointer-events:none}
  .opcao.errada .opcao-letra{background:#f87171;color:#2d0a0a}
  .opcao.errada .opcao-texto{color:#f87171}
  .opcao.bloqueada{pointer-events:none;opacity:0.35}
  .feedback{border-radius:14px;padding:14px 16px;margin-top:10px;font-size:14px;font-weight:700;line-height:1.5;display:none;animation:fadeIn 0.3s ease}
  .feedback.ok{background:#052e16;color:#4ade80;border:2px solid #166534}
  .feedback.err{background:#2d0a0a;color:#f87171;border:2px solid #991b1b}
  .btn-prox{width:100%;padding:14px;font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;color:white;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:14px;cursor:pointer;transition:all 0.2s;margin-top:12px;display:none;box-shadow:0 4px 16px rgba(99,102,241,0.4)}
  .btn-prox:hover{transform:translateY(-2px)}
  /* ----- mecanicas especiais ----- */
  .vf-wrap{display:flex;flex-direction:column;gap:10px}
  .vf-afirm{background:#1e293b;border-radius:14px;padding:13px 15px;font-size:14px;font-weight:700;color:#cbd5e1;line-height:1.4}
  .vf-btns{display:flex;gap:8px;margin-top:8px}
  .vf-btn{flex:1;padding:11px;border-radius:12px;border:2px solid #334155;background:#0f172a;color:#cbd5e1;font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;cursor:pointer;transition:all .2s}
  .vf-btn.v:hover{border-color:#4ade80;color:#4ade80}
  .vf-btn.f:hover{border-color:#f87171;color:#f87171}
  .vf-btn.sel-v{border-color:#4ade80;background:#052e16;color:#4ade80}
  .vf-btn.sel-f{border-color:#f87171;background:#2d0a0a;color:#f87171}
  .assoc-grid{display:flex;flex-direction:column;gap:9px}
  .assoc-row{display:grid;grid-template-columns:1fr;gap:8px}
  .assoc-item{background:#1e293b;border:2px solid #334155;border-radius:12px;padding:12px;font-size:13px;font-weight:700;color:#cbd5e1;cursor:pointer;transition:all .2s}
  .assoc-item.sel{border-color:#6366f1;background:#1e1b4b;color:white}
  .assoc-item.ok{border-color:#4ade80;background:#052e16;color:#4ade80;pointer-events:none}
  .assoc-item.err{border-color:#f87171;background:#2d0a0a;color:#f87171}
  .assoc-col-lbl{font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin:4px 0}
  .comp-letras{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:14px 0}
  .comp-slot{width:38px;height:46px;border-radius:10px;border:2px dashed #475569;background:#1e293b;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:white}
  .comp-slot.filled{border-style:solid;border-color:#6366f1;background:#1e1b4b}
  .comp-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
  .comp-tile{width:42px;height:48px;border-radius:10px;background:#334155;color:white;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;user-select:none}
  .comp-tile:hover{background:#6366f1;transform:translateY(-2px)}
  .comp-tile.usada{opacity:.25;pointer-events:none}
  .canvas-wrap{background:#0f172a;border:2px solid #334155;border-radius:16px;padding:8px;margin-bottom:8px;display:flex;justify-content:center}
  canvas.game-canvas{background:#020617;border-radius:10px;touch-action:none;max-width:100%}
  .dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:6px;justify-content:center;margin:10px auto 4px}
  .dpad button{border:none;border-radius:12px;background:#1e293b;color:white;font-size:22px;font-weight:900;cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center}
  .dpad button:active{background:#6366f1;transform:scale(.92)}
  .dpad .empty{background:transparent;pointer-events:none}
  .mec-instr{background:#1e1b4b;border:2px solid #4338ca;border-radius:12px;padding:11px 14px;font-size:13px;font-weight:700;color:#c7d2fe;margin-bottom:10px;line-height:1.4}
  .mec-alvo{text-align:center;font-size:14px;font-weight:800;color:#fbbf24;margin-bottom:8px}
  #tela-resultado{display:none;animation:fadeIn 0.5s ease;text-align:center}
  .res-emoji{font-size:72px;display:block;margin-bottom:12px;animation:bounce 0.8s ease}
  .res-titulo{font-size:26px;font-weight:900;color:white;margin-bottom:6px}
  .res-sub{font-size:14px;color:#94a3b8;margin-bottom:1.5rem}
  .res-card{background:#1e293b;border-radius:20px;padding:1.5rem;margin-bottom:1rem}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}
  .stat-box{background:#0f172a;border-radius:14px;padding:14px;text-align:center}
  .stat-val{font-size:30px;font-weight:900;color:white;display:block}
  .stat-lbl{font-size:12px;color:#64748b;display:block;margin-top:2px}
  .recap-titulo{font-size:12px;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;text-align:left}
  .recap-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .recap-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;font-size:13px;font-weight:700}
  .recap-item.ok{background:#052e16;color:#4ade80}
  .recap-item.err{background:#2d0a0a;color:#f87171}
  .btn-jogar-de-novo{width:100%;padding:14px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;color:#94a3b8;background:#1e293b;border:2px solid #334155;border-radius:14px;cursor:pointer;transition:all 0.2s;margin-top:0.5rem}
  .btn-jogar-de-novo:hover{border-color:#6366f1;color:white}
  .enviando-msg{font-size:13px;color:#64748b;margin-top:10px;text-align:center}
  .confetti-piece{position:fixed;top:-10px;pointer-events:none;animation:confettiFall linear forwards}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.2)}70%{transform:scale(0.9)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  @keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="container">
  <div id="tela-inicio">
    <span class="logo">🗺️</span>
    <div class="game-disc">Geografia · 7º Ano</div>
    <div class="game-title">População Brasileira</div>
    <div class="game-sub">20 fases · populoso x povoado e densidade demográfica</div>
    <div class="info-grid">
      <div class="info-box"><span class="info-icon">🎯</span><span class="info-label">Fases</span><span class="info-val">20</span></div>
      <div class="info-box"><span class="info-icon">❤️</span><span class="info-label">Vidas</span><span class="info-val">5</span></div>
      <div class="info-box"><span class="info-icon">⭐</span><span class="info-label">Pontos</span><span class="info-val">até 2000</span></div>
    </div>
    <div class="form-wrap">
      <span class="form-lbl">👤 Seu nome completo</span>
      <input class="form-inp" id="nome" type="text" placeholder="Digite seu nome...">
      <span class="form-lbl">🏫 Sua turma</span>
      <select class="form-select" id="turma">
        <option value="">— Selecione sua turma —</option>
        <option value="7º A">7º A</option>
        <option value="7º B">7º B</option>
        <option value="7º C">7º C</option>
      </select>
    </div>
    <button class="btn-start" onclick="iniciar()">🚀 Começar o jogo!</button>
  </div>
  <div id="hud">
    <div class="hud-row">
      <div class="hud-fase">Fase <span id="hud-fase-num">1</span>/20</div>
      <div class="hud-pontos">⭐ <span id="hud-pontos">0</span> pts</div>
      <div class="vidas" id="vidas-display">
        <span class="vida">❤️</span><span class="vida">❤️</span><span class="vida">❤️</span><span class="vida">❤️</span><span class="vida">❤️</span>
      </div>
    </div>
    <div class="progress-wrap"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <div id="tela-fase"></div>
  <div id="tela-resultado"></div>
</div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbydyp0t_TVhzz-ZJRoeO47qBccV7hDekbmUP1PFLoVpPtBiiGLwXFtSEKzzfYBklJ54/exec";
const FASES=[
  {tipo:'quiz',cor:'#f97316',emoji:'👥',pergunta:'O que é a <b>população absoluta</b> de um país?',opcoes:['A quantidade de gente por quilômetro quadrado','O número total de habitantes do país','A parte mais rica da população','O número de cidades do país'],correta:1,explicacao:'✅ População absoluta é o número total de habitantes de um lugar, sem dividir pela área. O Brasil tem mais de 200 milhões.'},

  {tipo:'quiz',cor:'#6366f1',emoji:'🇧🇷',pergunta:'O Brasil é considerado um país <b>populoso</b>. Isso quer dizer que ele...',opcoes:['Tem muita gente por km²','Tem um número total de habitantes muito grande','É um país pequeno','Tem poucas pessoas'],correta:1,explicacao:'✅ Populoso = tem muitos habitantes no total. O Brasil é o 7º país mais populoso do mundo, com mais de 200 milhões de pessoas.'},

  {tipo:'vf',cor:'#14b8a6',emoji:'⚖️',pergunta:'Verdadeiro ou Falso sobre <b>população absoluta</b>:',afirmacoes:[
    {txt:'População absoluta é o número total de habitantes.',v:true},
    {txt:'O Brasil tem mais de 200 milhões de habitantes.',v:true},
    {txt:'Um país populoso é sempre um país pequeno.',v:false}
  ],explicacao:'✅ População absoluta é o total de habitantes; o Brasil passa de 200 milhões; ser populoso não tem relação com o tamanho do território.'},

  {tipo:'quiz',cor:'#ec4899',emoji:'📊',pergunta:'O que é a <b>população relativa</b> (densidade demográfica)?',opcoes:['O número total de habitantes','O número de habitantes dividido pela área (hab/km²)','A população das cidades grandes','O número de nascimentos por ano'],correta:1,explicacao:'✅ População relativa, ou densidade demográfica, é a quantidade de habitantes por km². Calcula-se dividindo a população pela área.'},

  {tipo:'comecome',cor:'#8b5cf6',emoji:'😋',pergunta:'Pac-Geo dos conceitos!',alvo:'Coma só o que indica um país POPULOSO (número total)',certos:['👥','👨‍👩‍👧‍👦','🔢','🏙️'],errados:['📐','🗺️','📏','🧮'],explicacao:'✅ País populoso se refere ao número total de habitantes (muita gente somada), não à área nem à divisão por km².'},

  {tipo:'quiz',cor:'#f59e0b',emoji:'🧮',pergunta:'Como se <b>calcula</b> a densidade demográfica?',opcoes:['População × área','População ÷ área','Área ÷ população','População + área'],correta:1,explicacao:'✅ Densidade demográfica = população ÷ área. O resultado aparece em habitantes por km² (hab/km²).'},

  {tipo:'assoc',cor:'#3b82f6',emoji:'🔗',pergunta:'Associe cada <b>conceito</b> à sua definição:',pares:[
    {a:'População absoluta',b:'Número total de habitantes'},
    {a:'População relativa',b:'Habitantes por km² (densidade)'},
    {a:'País populoso',b:'Tem muitos habitantes no total'},
    {a:'País povoado',b:'Tem alta densidade demográfica'}
  ],explicacao:'✅ Absoluta = total; relativa = por km²; populoso = muita gente somada; povoado = muita gente por km².'},

  {tipo:'quiz',cor:'#10b981',emoji:'🌎',pergunta:'Apesar de ter muita gente, o Brasil é considerado um país <b>pouco povoado</b>. Por quê?',opcoes:['Porque tem poucos habitantes','Porque seu território é enorme, então a densidade (hab/km²) é baixa','Porque ninguém mora no interior','Porque é um país pequeno'],correta:1,explicacao:'✅ O Brasil tem muita gente (populoso), mas como o território é gigante, a densidade fica baixa (cerca de 25 hab/km²): por isso é pouco povoado.'},

  {tipo:'labirinto',cor:'#e11d48',emoji:'🧭',pergunta:'Fuja das bombas e pegue a resposta certa!',alvo:'Pegue o que define um país POVOADO',start:{x:0,y:0},exit:{x:6,y:6},
   mapa:['.......','.#.#.#.','.......','.#.#.#.','.......','.#.#.#.','.......'],
   itens:[{x:2,y:2,label:'ALTA DENS.',certo:true,bomba:false},{x:4,y:2,label:'MUITA AREA',certo:false,bomba:true},{x:5,y:4,label:'POUCA GENTE',certo:false,bomba:true},{x:1,y:4,label:'PAIS GRANDE',certo:false,bomba:true}],
   explicacao:'✅ Povoado = alta densidade demográfica (muitos habitantes por km²). Não confunda com populoso (muita gente no total).'},

  {tipo:'quiz',cor:'#6366f1',emoji:'❓',pergunta:'Qual a <b>diferença</b> entre populoso e povoado?',opcoes:['São a mesma coisa','Populoso = muita gente no total; povoado = muita gente por km²','Populoso = por km²; povoado = no total','Os dois significam país pequeno'],correta:1,explicacao:'✅ Populoso fala do número total de habitantes; povoado fala da densidade (hab/km²). O Brasil é populoso, mas pouco povoado.'},

  {tipo:'memoria',cor:'#ec4899',emoji:'🧠',pergunta:'Jogo da memória: ligue cada <b>conceito</b> à definição.',pares:[
    {a:'Populoso',b:'Muitos habitantes no total'},
    {a:'Povoado',b:'Muitos habitantes por km²'},
    {a:'Densidade',b:'População ÷ área'}
  ],explicacao:'✅ Populoso = total alto; povoado = densidade alta; densidade = população dividida pela área.'},

  {tipo:'quiz',cor:'#f97316',emoji:'📐',pergunta:'Um país tem 100 milhões de habitantes e 1 milhão de km². Qual é a densidade demográfica?',opcoes:['100 hab/km²','10 hab/km²','1.000 hab/km²','100 milhões hab/km²'],correta:0,explicacao:'✅ Densidade = 100.000.000 ÷ 1.000.000 = 100 hab/km². Basta dividir a população pela área.'},

  {tipo:'completar',cor:'#10b981',emoji:'🔤',pergunta:'Complete a palavra:',dica:'Número de habitantes por km². Também chamada de população relativa.',palavra:'DENSIDADE',extra:['B','M','R','T'],explicacao:'✅ Densidade demográfica é a população relativa: quantos habitantes existem em cada km².'},

  {tipo:'comecome',cor:'#8b5cf6',emoji:'😋',pergunta:'Pac-Geo da densidade!',alvo:'Coma só o que ajuda a CALCULAR a densidade demográfica',certos:['👥','📐','➗','🗺️'],errados:['🎸','🍕','⚽','🚗'],explicacao:'✅ Para calcular densidade precisamos da população (gente), da área (mapa/medida) e da divisão entre elas.'},

  {tipo:'vf',cor:'#3b82f6',emoji:'⚖️',pergunta:'Verdadeiro ou Falso sobre o <b>Brasil</b>:',afirmacoes:[
    {txt:'O Brasil é um país populoso (muitos habitantes no total).',v:true},
    {txt:'O Brasil é um país muito povoado, com densidade altíssima.',v:false},
    {txt:'A baixa densidade do Brasil se explica pelo território enorme.',v:true}
  ],explicacao:'✅ O Brasil é populoso, mas pouco povoado: a densidade é baixa porque o território é muito grande.'},

  {tipo:'quiz',cor:'#f59e0b',emoji:'🌍',pergunta:'A população do Brasil <b>não está distribuída</b> de forma igual. Onde vive a maior parte?',opcoes:['No interior da Amazônia','No litoral e nas regiões Sudeste e Sul','No Pantanal','Espalhada igualmente por todo o país'],correta:1,explicacao:'✅ A população se concentra no litoral e no Sudeste/Sul. O interior e a Amazônia têm densidade muito baixa.'},

  {tipo:'labirinto',cor:'#e11d48',emoji:'🧭',pergunta:'Pegue a resposta certa e chegue à saída!',alvo:'Pegue o número aproximado de habitantes do BRASIL',start:{x:0,y:3},exit:{x:6,y:3},
   mapa:['.#...#.','.#.#.#.','...#...','.......','...#...','.#.#.#.','.#...#.'],
   itens:[{x:3,y:3,label:'+200 MI',certo:true,bomba:false},{x:2,y:1,label:'2 MI',certo:false,bomba:true},{x:4,y:5,label:'50 MI',certo:false,bomba:true},{x:5,y:2,label:'1 BI',certo:false,bomba:true}],
   explicacao:'✅ O Brasil tem mais de 200 milhões de habitantes, sendo um dos países mais populosos do mundo.'},

  {tipo:'quiz',cor:'#6366f1',emoji:'🏆',pergunta:'O Brasil está entre os países mais <b>populosos</b> do mundo. Em que posição aproximada?',opcoes:['1º lugar','Entre os 10 mais populosos (por volta do 7º)','Último lugar','100º lugar'],correta:1,explicacao:'✅ O Brasil é cerca do 7º país mais populoso do mundo, atrás de gigantes como Índia, China e Estados Unidos.'},

  {tipo:'completar',cor:'#14b8a6',emoji:'🔤',pergunta:'Complete a palavra:',dica:'País com muitos habitantes no total, como o Brasil.',palavra:'POPULOSO',extra:['A','M','R','T'],explicacao:'✅ Populoso é o país com grande número total de habitantes. O Brasil é populoso, mas pouco povoado.'},

  {tipo:'quiz',cor:'#7c3aed',emoji:'🎯',pergunta:'Resumindo tudo: qual frase descreve <b>corretamente</b> o Brasil?',opcoes:['Pouco populoso e muito povoado','Muito populoso e pouco povoado','Pouco populoso e pouco povoado','Muito populoso e muito povoado'],correta:1,explicacao:'✅ O Brasil é muito populoso (mais de 200 milhões no total) e pouco povoado (densidade baixa por causa do território enorme).'}
];
const TOTAL=FASES.length;
let nomeJogador='',turmaJogador='',faseAtual=0,vidas=5,pontos=0,acertos=0,historico=[],respondeu=false;

function iniciar(){nomeJogador=document.getElementById('nome').value.trim();turmaJogador=document.getElementById('turma').value;if(!nomeJogador){flashErro('nome');return;}if(!turmaJogador){flashErro('turma');return;}document.getElementById('tela-inicio').style.display='none';document.getElementById('hud').style.display='block';carregarFase();}
function flashErro(id){const el=document.getElementById(id);el.style.borderColor='#f87171';setTimeout(()=>el.style.borderColor='#334155',1500);}
function atualizarVidas(){document.querySelectorAll('.vida').forEach((v,i)=>v.classList.toggle('perdida',i>=vidas));}
function setHud(){document.getElementById('hud-fase-num').textContent=faseAtual+1;document.getElementById('hud-pontos').textContent=pontos;document.getElementById('progress-fill').style.width=(faseAtual/TOTAL*100)+'%';atualizarVidas();}

function carregarFase(){respondeu=false;const fase=FASES[faseAtual];setHud();document.getElementById('tela-fase').style.display='block';
  const tipo=fase.tipo||'quiz';
  if(tipo==='quiz')renderQuiz(fase);
  else if(tipo==='vf')renderVF(fase);
  else if(tipo==='assoc')renderAssoc(fase);
  else if(tipo==='memoria')renderMemoria(fase);
  else if(tipo==='completar')renderCompletar(fase);
  else if(tipo==='comecome')renderComeCome(fase);
  else if(tipo==='labirinto')renderLabirinto(fase);
}
function tagMec(txt){return txt?`<span class="tag-mec">${txt}</span>`:'';}
function badge(fase,mec){return `<div class="fase-badge"><div class="fase-num-badge">${faseAtual+1}</div>Fase ${faseAtual+1} de ${TOTAL}${tagMec(mec)}</div>`;}
function cardPergunta(fase){return `<div class="pergunta-card" style="--cor:${fase.cor}"><span class="pergunta-emoji">${fase.emoji}</span><div class="pergunta-texto">${fase.pergunta}</div></div>`;}
function botaoProx(){return `<div class="feedback" id="feedback"></div><button class="btn-prox" id="btn-prox" onclick="proximaFase()">Próxima fase →</button>`;}

function acertou(){pontos+=100;acertos++;historico.push({fase:faseAtual+1,ok:true});document.getElementById('hud-pontos').textContent=pontos;}
function errou(){vidas--;historico.push({fase:faseAtual+1,ok:false});atualizarVidas();}
function mostrarFB(ok,txtOk,txtErr){const fb=document.getElementById('feedback');fb.className='feedback '+(ok?'ok':'err');fb.textContent=ok?txtOk:txtErr;fb.style.display='block';if(!ok){const tf=document.getElementById('tela-fase');if(tf){tf.style.animation='shake 0.4s ease';setTimeout(()=>{if(tf)tf.style.animation='';},400);}}}
function liberarProx(){const btn=document.getElementById('btn-prox');btn.style.display='block';if(vidas===0){btn.textContent='💔 Ver resultado →';btn.onclick=()=>encerrar(false);}else if(faseAtual===TOTAL-1){btn.textContent='🏆 Ver resultado!';btn.onclick=()=>encerrar(true);}}
function finalizarFase(ok,txtOk,txtErr){if(ok)acertou();else errou();mostrarFB(ok,txtOk,txtErr);liberarProx();}

/* ---------- QUIZ ---------- */
function renderQuiz(fase){const opHTML=fase.opcoes.map((op,i)=>`<div class="opcao" onclick="respQuiz(${i})" id="op-${i}"><div class="opcao-letra">${['A','B','C','D'][i]}</div><div class="opcao-texto">${op}</div></div>`).join('');
  document.getElementById('tela-fase').innerHTML=`<div style="animation:fadeUp 0.4s ease">${badge(fase)}${cardPergunta(fase)}<div class="opcoes">${opHTML}</div>${botaoProx()}</div>`;}
function respQuiz(idx){if(respondeu)return;respondeu=true;const fase=FASES[faseAtual];const ok=idx===fase.correta;document.querySelectorAll('.opcao').forEach((el,i)=>{if(i===fase.correta)el.classList.add('correta');else if(i===idx&&!ok)el.classList.add('errada');else el.classList.add('bloqueada');});finalizarFase(ok,fase.explicacao,'❌ Errou! A resposta certa era a '+['A','B','C','D'][fase.correta]+'. '+fase.explicacao.replace('✅','💡'));}

/* ---------- VERDADEIRO/FALSO ---------- */
function renderVF(fase){const afHTML=fase.afirmacoes.map((a,i)=>`<div class="vf-afirm">${i+1}. ${a.txt}<div class="vf-btns"><button class="vf-btn v" id="vf-${i}-v" onclick="vfPick(${i},true)">✔ Verdadeiro</button><button class="vf-btn f" id="vf-${i}-f" onclick="vfPick(${i},false)">✘ Falso</button></div></div>`).join('');
  document.getElementById('tela-fase').innerHTML=`<div style="animation:fadeUp 0.4s ease">${badge(fase,'V ou F')}${cardPergunta(fase)}<div class="vf-wrap">${afHTML}</div>${botaoProx()}</div>`;
  window._vf={resp:new Array(fase.afirmacoes.length).fill(null)};}
function vfPick(i,val){if(respondeu)return;window._vf.resp[i]=val;const fase=FASES[faseAtual];document.getElementById('vf-'+i+'-v').classList.toggle('sel-v',val);document.getElementById('vf-'+i+'-f').classList.toggle('sel-f',!val);
  if(window._vf.resp.every(r=>r!==null)){respondeu=true;let allOk=true;fase.afirmacoes.forEach((a,j)=>{const certo=window._vf.resp[j]===a.v;if(!certo)allOk=false;['v','f'].forEach(s=>document.getElementById('vf-'+j+'-'+s).style.pointerEvents='none');const btnSel=document.getElementById('vf-'+j+'-'+(window._vf.resp[j]?'v':'f'));btnSel.style.borderColor=certo?'#4ade80':'#f87171';btnSel.style.background=certo?'#052e16':'#2d0a0a';btnSel.style.color=certo?'#4ade80':'#f87171';});
  finalizarFase(allOk,fase.explicacao,'❌ Quase! Reveja: '+fase.explicacao.replace('✅','💡'));}}

/* ---------- ASSOCIACAO ---------- */
function renderAssoc(fase){const esq=fase.pares.map((p,i)=>`<div class="assoc-item" id="ae-${i}" onclick="assocEsq(${i})">${p.a}</div>`).join('');
  const dirIdx=fase.pares.map((p,i)=>i);for(let k=dirIdx.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[dirIdx[k],dirIdx[j]]=[dirIdx[j],dirIdx[k]];}
  const dir=dirIdx.map(i=>`<div class="assoc-item" id="ad-${i}" onclick="assocDir(${i})">${fase.pares[i].b}</div>`).join('');
  document.getElementById('tela-fase').innerHTML=`<div style="animation:fadeUp 0.4s ease">${badge(fase,'Associação')}${cardPergunta(fase)}<div class="mec-instr">Toque num item da coluna 1 e depois no par correspondente da coluna 2.</div><div class="assoc-col-lbl">Coluna 1</div><div class="assoc-grid">${esq}</div><div class="assoc-col-lbl">Coluna 2</div><div class="assoc-grid">${dir}</div>${botaoProx()}</div>`;
  window._as={selEsq:null,feitos:0,erros:0,total:fase.pares.length};}
function assocEsq(i){if(respondeu)return;const st=window._as;if(document.getElementById('ae-'+i).classList.contains('ok'))return;document.querySelectorAll('[id^=ae-]').forEach(e=>e.classList.remove('sel'));document.getElementById('ae-'+i).classList.add('sel');st.selEsq=i;}
function assocDir(j){if(respondeu)return;const st=window._as;if(st.selEsq===null)return;if(document.getElementById('ad-'+j).classList.contains('ok'))return;const ok=st.selEsq===j;const ae=document.getElementById('ae-'+st.selEsq),ad=document.getElementById('ad-'+j);
  if(ok){ae.classList.remove('sel');ae.classList.add('ok');ad.classList.add('ok');st.feitos++;if(st.feitos===st.total){respondeu=true;const fase=FASES[faseAtual];finalizarFase(st.erros===0,fase.explicacao,'⚠️ Você completou, mas com '+st.erros+' tentativa(s) errada(s). '+fase.explicacao.replace('✅','💡'));}}
  else{st.erros++;ad.classList.add('err');setTimeout(()=>ad.classList.remove('err'),500);ae.classList.remove('sel');st.selEsq=null;}}

/* ---------- MEMORIA ---------- */
function renderMemoria(fase){let cartas=[];fase.pares.forEach((p,i)=>{cartas.push({id:i,txt:p.a,grupo:i});cartas.push({id:i,txt:p.b,grupo:i});});for(let k=cartas.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[cartas[k],cartas[j]]=[cartas[j],cartas[k]];}
  const grid=cartas.map((c,i)=>`<div class="assoc-item" style="min-height:64px;display:flex;align-items:center;justify-content:center;text-align:center" id="mem-${i}" data-grupo="${c.grupo}" onclick="memFlip(${i})"><span id="memtxt-${i}" style="visibility:hidden">${c.txt}</span><span id="memq-${i}">❓</span></div>`).join('');
  document.getElementById('tela-fase').innerHTML=`<div style="animation:fadeUp 0.4s ease">${badge(fase,'Memória')}${cardPergunta(fase)}<div class="mec-instr">Encontre os pares: cada conceito tem a sua definição. Vire duas cartas por vez.</div><div class="assoc-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${grid}</div>${botaoProx()}</div>`;
  window._mem={virada:null,pares:0,total:fase.pares.length,erros:0,trava:false};}
function memFlip(i){const st=window._mem;if(respondeu||st.trava)return;const card=document.getElementById('mem-'+i);if(card.classList.contains('ok')||card===st.viradaEl)return;document.getElementById('memtxt-'+i).style.visibility='visible';document.getElementById('memq-'+i).style.display='none';card.classList.add('sel');
  if(st.virada===null){st.virada=i;st.viradaEl=card;}
  else{st.trava=true;const g1=document.getElementById('mem-'+st.virada).dataset.grupo,g2=card.dataset.grupo;
    if(g1===g2){setTimeout(()=>{document.getElementById('mem-'+st.virada).classList.remove('sel');card.classList.remove('sel');document.getElementById('mem-'+st.virada).classList.add('ok');card.classList.add('ok');st.pares++;st.virada=null;st.viradaEl=null;st.trava=false;if(st.pares===st.total){respondeu=true;const fase=FASES[faseAtual];finalizarFase(st.erros===0,fase.explicacao,'⚠️ Completou com '+st.erros+' erro(s). '+fase.explicacao.replace('✅','💡'));}},420);}
    else{st.erros++;const i1=st.virada;setTimeout(()=>{[i1,i].forEach(k=>{document.getElementById('memtxt-'+k).style.visibility='hidden';document.getElementById('memq-'+k).style.display='inline';document.getElementById('mem-'+k).classList.remove('sel');});st.virada=null;st.viradaEl=null;st.trava=false;},700);}}}

/* ---------- COMPLETAR PALAVRA ---------- */
function renderCompletar(fase){const palavra=fase.palavra.toUpperCase();const slots=palavra.split('').map((c,i)=>`<div class="comp-slot" id="slot-${i}" onclick="compRemove(${i})"></div>`).join('');
  let letras=palavra.split('');const extra=fase.extra||['A','E','O','R','S'];letras=letras.concat(extra).slice(0,Math.max(palavra.length+3,letras.length));
  for(let k=letras.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[letras[k],letras[j]]=[letras[j],letras[k]];}
  const pool=letras.map((c,i)=>`<div class="comp-tile" id="tile-${i}" onclick="compAdd(${i},'${c}')">${c}</div>`).join('');
  document.getElementById('tela-fase').innerHTML=`<div style="animation:fadeUp 0.4s ease">${badge(fase,'Completar')}${cardPergunta(fase)}<div class="mec-instr">${fase.dica}</div><div class="comp-letras">${slots}</div><div class="comp-pool">${pool}</div>${botaoProx()}</div>`;
  window._comp={palavra,preench:new Array(palavra.length).fill(null),pos:0};}
function compAdd(tileIdx,letra){if(respondeu)return;const st=window._comp;if(st.pos>=st.palavra.length)return;const tile=document.getElementById('tile-'+tileIdx);if(tile.classList.contains('usada'))return;const slot=document.getElementById('slot-'+st.pos);slot.textContent=letra;slot.classList.add('filled');st.preench[st.pos]={letra,tileIdx};tile.classList.add('usada');st.pos++;
  if(st.pos===st.palavra.length){respondeu=true;const tent=st.preench.map(p=>p.letra).join('');const ok=tent===st.palavra;document.querySelectorAll('.comp-slot').forEach((s,i)=>{s.style.borderColor=ok?'#4ade80':'#f87171';s.style.background=ok?'#052e16':'#2d0a0a';s.style.color=ok?'#4ade80':'#f87171';});const fase=FASES[faseAtual];finalizarFase(ok,fase.explicacao,'❌ A palavra certa era '+st.palavra+'. '+fase.explicacao.replace('✅','💡'));}}
function compRemove(slotIdx){if(respondeu)return;const st=window._comp;const p=st.preench[slotIdx];if(!p)return;if(slotIdx!==st.pos-1)return;const slot=document.getElementById('slot-'+slotIdx);slot.textContent='';slot.classList.remove('filled');document.getElementById('tile-'+p.tileIdx).classList.remove('usada');st.preench[slotIdx]=null;st.pos--;}

/* ---------- MOTOR DE GRADE (come-come e labirinto) ---------- */
function gridEngine(fase,opts){const cols=opts.cols,rows=opts.rows,cell=opts.cell;const cv=document.getElementById('mecCanvas');const ctx=cv.getContext('2d');cv.width=cols*cell;cv.height=rows*cell;
  const st=opts.state;
  function draw(){ctx.clearRect(0,0,cv.width,cv.height);
    for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){if(st.walls&&st.walls[y][x]){ctx.fillStyle='#1e293b';ctx.fillRect(x*cell,y*cell,cell,cell);}}
    if(st.exit){ctx.fillStyle='#052e16';ctx.fillRect(st.exit.x*cell+3,st.exit.y*cell+3,cell-6,cell-6);ctx.fillStyle='#4ade80';ctx.font='bold '+(cell*0.5)+'px Nunito';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',st.exit.x*cell+cell/2,st.exit.y*cell+cell/2);}
    st.items.forEach(it=>{if(it.got)return;ctx.font=(cell*0.6)+'px Nunito';ctx.textAlign='center';ctx.textBaseline='middle';
      if(it.label!==undefined){ctx.fillStyle=it.bomba?'#2d0a0a':'#1e1b4b';ctx.fillRect(it.x*cell+2,it.y*cell+2,cell-4,cell-4);ctx.fillStyle=it.bomba?'#f87171':'#c7d2fe';ctx.font='bold '+(cell*0.32)+'px Nunito';ctx.fillText(it.label,it.x*cell+cell/2,it.y*cell+cell/2);}
      else{ctx.fillText(it.emoji,it.x*cell+cell/2,it.y*cell+cell/2);}});
    ctx.font=(cell*0.62)+'px Nunito';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(st.player.emoji||'🧭',st.player.x*cell+cell/2,st.player.y*cell+cell/2);}
  st.draw=draw;draw();return st;}
function tryMove(st,dx,dy,cols,rows){if(respondeu)return;const nx=st.player.x+dx,ny=st.player.y+dy;if(nx<0||ny<0||nx>=cols||ny>=rows)return;if(st.walls&&st.walls[ny][nx])return;st.player.x=nx;st.player.y=ny;if(st.onMove)st.onMove();st.draw();}
function dpadHTML(){return `<div class="dpad"><div class="empty"></div><button onclick="mecMove(0,-1)">▲</button><div class="empty"></div><button onclick="mecMove(-1,0)">◀</button><div class="empty"></div><button onclick="mecMove(1,0)">▶</button><div class="empty"></div><button onclick="mecMove(0,1)">▼</button><div class="empty"></div></div>`;}
let _mecState=null,_mecDims=null;
function mecMove(dx,dy){if(!_mecState)return;tryMove(_mecState,dx,dy,_mecDims.cols,_mecDims.rows);}
document.addEventListener('keydown',e=>{if(!_mecState)return;const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(m[e.key]){e.preventDefault();mecMove(m[e.key][0],m[e.key][1]);}});

/* ---------- COME-COME ---------- */
function renderComeCome(fase){const cols=7,rows=6,cell=46;
  document.getElementById('tela-fase').innerHTML=`<div style="animation:fadeUp 0.4s ease">${badge(fase,'Come-come')}${cardPergunta(fase)}<div class="mec-alvo">🎯 ${fase.alvo}</div><div class="mec-instr">Mova o 😋 para comer só os itens CERTOS. Comer um errado custa o acerto da fase!</div><div class="canvas-wrap"><canvas id="mecCanvas" class="game-canvas"></canvas></div>${dpadHTML()}${botaoProx()}</div>`;
  let cells=[];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(!(x===0&&y===0))cells.push({x,y});
  for(let k=cells.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[cells[k],cells[j]]=[cells[j],cells[k]];}
  const itens=[];fase.certos.forEach((e,i)=>{const c=cells.pop();itens.push({x:c.x,y:c.y,emoji:e,certo:true,got:false});});fase.errados.forEach((e,i)=>{const c=cells.pop();itens.push({x:c.x,y:c.y,emoji:e,certo:false,got:false});});
  const st={player:{x:0,y:0,emoji:'😋'},items:itens,totalCertos:fase.certos.length,comidosCertos:0,errouItem:false};
  st.onMove=function(){st.items.forEach(it=>{if(!it.got&&it.x===st.player.x&&it.y===st.player.y){it.got=true;if(it.certo){st.comidosCertos++;}else{st.errouItem=true;}st.draw();if(st.errouItem){respondeu=true;_mecState=null;finalizarFase(false,'',fase.explicacao.replace('✅','💡')+' (Você comeu um item errado.)');}else if(st.comidosCertos===st.totalCertos){respondeu=true;_mecState=null;finalizarFase(true,fase.explicacao,'');}}});};
  _mecDims={cols,rows};_mecState=gridEngine(fase,{cols,rows,cell,state:st});}

/* ---------- LABIRINTO COM BOMBA ---------- */
function renderLabirinto(fase){const cols=7,rows=7,cell=44;
  document.getElementById('tela-fase').innerHTML=`<div style="animation:fadeUp 0.4s ease">${badge(fase,'Labirinto')}${cardPergunta(fase)}<div class="mec-alvo">🎯 ${fase.alvo}</div><div class="mec-instr">Chegue até a saída ★ pegando a resposta CERTA. As 💣 são respostas erradas: encostar nelas tira o acerto!</div><div class="canvas-wrap"><canvas id="mecCanvas" class="game-canvas"></canvas></div>${dpadHTML()}${botaoProx()}</div>`;
  const walls=[];for(let y=0;y<rows;y++){walls.push([]);for(let x=0;x<cols;x++)walls[y].push(fase.mapa[y][x]==='#');}
  const itens=[];fase.itens.forEach(it=>{itens.push({x:it.x,y:it.y,label:it.label,bomba:it.bomba,certo:it.certo,got:false});});
  const st={player:{x:fase.start.x,y:fase.start.y,emoji:'🧭'},items:itens,walls,exit:fase.exit,pegouCerto:false};
  st.onMove=function(){st.items.forEach(it=>{if(!it.got&&it.x===st.player.x&&it.y===st.player.y){it.got=true;if(it.bomba){st.draw();respondeu=true;_mecState=null;finalizarFase(false,'',fase.explicacao.replace('✅','💡')+' (Você encostou numa resposta errada.)');}else if(it.certo){st.pegouCerto=true;}st.draw();}});
    if(st.player.x===st.exit.x&&st.player.y===st.exit.y){respondeu=true;_mecState=null;if(st.pegouCerto)finalizarFase(true,fase.explicacao,'');else finalizarFase(false,'','Você chegou à saída sem pegar a resposta certa. '+fase.explicacao.replace('✅','💡'));}};
  _mecDims={cols,rows};_mecState=gridEngine(fase,{cols,rows,cell,state:st});}

/* ---------- FLUXO ---------- */
function proximaFase(){_mecState=null;faseAtual++;if(faseAtual>=TOTAL||vidas===0)encerrar(faseAtual>=TOTAL&&vidas>0);else carregarFase();}
function encerrar(venceu){_mecState=null;document.getElementById('tela-fase').style.display='none';document.getElementById('progress-fill').style.width='100%';const pct=Math.round(acertos/TOTAL*100);const primeiro=nomeJogador.split(' ')[0];let emoji,titulo,sub;if(acertos===TOTAL){emoji='🏆';titulo='Perfeito, '+primeiro+'!';sub='Você acertou todas as 20 fases!';}else if(acertos>=Math.ceil(TOTAL*0.7)){emoji='🎉';titulo='Muito bem, '+primeiro+'!';sub='Ótimo desempenho!';}else if(acertos>=Math.ceil(TOTAL*0.5)){emoji='👍';titulo='Bom trabalho, '+primeiro+'!';sub='Continue estudando!';}else if(vidas===0){emoji='💔';titulo='Fim de jogo, '+primeiro+'!';sub='Perdeu todas as vidas. Tente de novo!';}else{emoji='📚';titulo='Continue estudando, '+primeiro+'!';sub='Revise o conteúdo e tente novamente!';}
  const recapHTML=historico.map(h=>`<div class="recap-item ${h.ok?'ok':'err'}"><span>${h.ok?'✅':'❌'}</span><span>Fase ${h.fase} ${h.ok?'· +100 pts':'· −1 vida'}</span></div>`).join('');
  document.getElementById('tela-resultado').style.display='block';document.getElementById('tela-resultado').innerHTML=`<span class="res-emoji">${emoji}</span><div class="res-titulo">${titulo}</div><div class="res-sub">${sub}</div><div class="res-card"><div class="stats-grid"><div class="stat-box"><span class="stat-val">${acertos}/${TOTAL}</span><span class="stat-lbl">Acertos</span></div><div class="stat-box"><span class="stat-val">${pontos}</span><span class="stat-lbl">Pontos</span></div><div class="stat-box"><span class="stat-val">${pct}%</span><span class="stat-lbl">Aproveitamento</span></div><div class="stat-box"><span class="stat-val">${Math.max(vidas,0)}❤️</span><span class="stat-lbl">Vidas restantes</span></div></div><div class="recap-titulo">Histórico de fases</div><div class="recap-grid">${recapHTML}</div></div><button class="btn-jogar-de-novo" onclick="location.reload()">↩ Jogar de novo</button><p class="enviando-msg" id="enviando-msg">Enviando resultado para a planilha...</p>`;
  if(acertos>=Math.ceil(TOTAL*0.5))confetes();enviarResultado(pct);}
function enviarResultado(pct){const dados={nome:nomeJogador,turma:turmaJogador,horario:new Date().toLocaleString('pt-BR'),acertos:acertos+'/'+TOTAL,pontos,aproveitamento:pct+'%',vidas_restantes:Math.max(vidas,0),status:vidas===0?'Game Over':(acertos===TOTAL?'Completo — Perfeito!':'Completo')};fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(dados)}).then(()=>{const el=document.getElementById('enviando-msg');if(el)el.textContent='✅ Resultado registrado na planilha!';}).catch(()=>{const el=document.getElementById('enviando-msg');if(el)el.textContent='';});}
function confetes(){const cores=['#6366f1','#ec4899','#14b8a6','#f97316','#8b5cf6','#4ade80','#facc15','#3b82f6'];for(let i=0;i<80;i++)setTimeout(()=>{const c=document.createElement('div');c.className='confetti-piece';c.style.cssText=`left:${Math.random()*100}vw;background:${cores[~~(Math.random()*cores.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;animation-duration:${2+Math.random()*2.5}s;animation-delay:${Math.random()*0.8}s;border-radius:${Math.random()>.5?'50%':'2px'};`;document.body.appendChild(c);setTimeout(()=>c.remove(),5500);},i*30);}
</script>
</body>
</html>
